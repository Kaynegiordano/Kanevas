# Version web de Kanevas : publie le dossier app/ sur GitHub Pages à chaque push sur main.
# Sans Electron, Kanevas passe par le navigateur pour ouvrir et enregistrer ; l'IA locale,
# les sauvegardes de secours et les mises à jour restent propres à l'application de bureau.
name: Version web

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
