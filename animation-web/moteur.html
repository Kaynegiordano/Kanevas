<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>__TITRE__</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="assets.js"></script>
<script>
/* =====================================================================================
   Moteur generique de fond d'ecran anime (Wallpaper Engine, type Web).
   Tout est decrit par anim.json (injecte ici par outils\build.py) :
     effets  : deformations de l'image de fond pilotees par des masques (shader)
     calques : cheveux (ressorts), membre (deformation marionnette le long d'un squelette),
               rigide (pivot), visage (clignement par sequence d'images LivePortrait)
   Sans entrée souris, les mouvements restent périodiques : boucle parfaite pour l'export vidéo.
   ===================================================================================== */
const ANIM = __ANIM__;
const A = window.ASSETS;                                   // chemin du fichier -> data URI
const IMG_W = ANIM.taille[0], IMG_H = ANIM.taille[1];
const LOOP = ANIM.boucle || 20, TAU = 2 * Math.PI;
const W = w => TAU * Math.max(1, Math.round(w * LOOP / TAU)) / LOOP;   // frequence arrondie : periodique sur LOOP
const PX = ANIM.parallaxe || {};
const DC = PX.plan ?? ANIM.centre_profondeur ?? 0.6;      // profondeur qui reste immobile (0 = fond, 1 = premier plan)
const WDIR = (() => { const v = ANIM.vent || [0.9, -0.2], n = Math.hypot(v[0], v[1]); return [v[0] / n, v[1] / n]; })();
const WPERP = [-WDIR[1], WDIR[0]];

/* ---------- curseurs (Wallpaper Engine) ---------- */
const INTERACTION = ANIM.interaction || {};
const S = { vitesse: 1, profondeur: 1, kane_regard: !!INTERACTION.regard, kane_tete: !!INTERACTION.tete,
  kane_clic: !!INTERACTION.clic, kane_interaction_force: INTERACTION.force ?? .65 };
for (const k in (ANIM.curseurs || {})) { const c = ANIM.curseurs[k]; S[k] = c.type === 'bool' ? (c.defaut !== false) : (c.defaut ?? 1); }
const val = k => { if (!k) return 1; const v = S[k]; return v === true ? 1 : v === false ? 0 : (v ?? 1); };

const canvas = document.getElementById('c');
const interaction = { x:0, y:0, tx:0, ty:0, blend:0, active:false, last:-Infinity, clicked:-Infinity };
let pendingReaction = false;
let renderedHead = 0, renderedLift = 0;
const strength = () => Math.max(0, Math.min(1, +S.kane_interaction_force || 0));
function clickPulse(duration) { const t = (performance.now() - interaction.clicked) / 1000 / duration; return t < 0 || t > 1 ? 0 : Math.sin(Math.PI * t) ** 2; }
function headInteraction() { return strength() * ((S.kane_tete ? interaction.x * interaction.blend * .04 : 0) + (S.kane_clic ? clickPulse(.85) * .018 : 0)); }
function headLift() { return S.kane_tete ? strength() * interaction.y * interaction.blend * IMG_H * .003 : 0; }
function react() {
  const now = performance.now();
  if (!S.kane_clic || now - interaction.clicked < 700) return false;
  interaction.clicked = now; return true;
}
addEventListener('mousemove', e => { interaction.tx = Math.max(-1, Math.min(1, e.clientX / innerWidth * 2 - 1)); interaction.ty = Math.max(-1, Math.min(1, e.clientY / innerHeight * 2 - 1)); interaction.active = true; interaction.last = performance.now(); });
addEventListener('mouseout', e => { if (!e.relatedTarget) { interaction.active = false; interaction.tx = interaction.ty = 0; } });
canvas.addEventListener('click', e => { if (e.button === 0) react(); });
addEventListener('message', e => { if (e.source === parent && e.origin === location.origin && e.data?.type === 'kane-test-reaction') { if (window.READY) react(); else pendingReaction = true; } });
function updateInteraction(dt) {
  if (performance.now() - interaction.last > 3000) { interaction.active = false; interaction.tx = interaction.ty = 0; }
  const k = 1 - Math.exp(-Math.max(0, dt) * 5);
  interaction.x += (interaction.tx - interaction.x) * k;
  interaction.y += (interaction.ty - interaction.y) * k;
  interaction.blend += ((interaction.active ? 1 : 0) - interaction.blend) * k;
}
window.KaneInteraction = { trigger: react, state: () => ({...interaction, head:headInteraction(), strength:strength(),
  lift:headLift(), available:{tete:FX.some(e=>e.type==='tete'),regard:LAYERS.some(l=>l.type==='visage'&&l.mode==='expression'),clignement:LAYERS.some(l=>l.type==='visage'&&l.mode!=='expression')} }) };
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });

/* =====================================================================================
   Passe 1 : fond deforme (shader genere a partir de ANIM.effets)
   ===================================================================================== */
const FX = ANIM.effets || [];
const NMASK = (ANIM.masques || []).length;
const f = x => (+x).toFixed(4);
const v2 = p => `vec2(${f(p[0])},${f(p[1])})`;
const ch = c => { const m = /^m(\d)\.([rgb])$/.exec(c || ''); if (!m) return '1.0'; return `M${+m[1] - 1}.${m[2]}`; };
let fxD = '', fxC = '', fxU = '';
FX.forEach((e, i) => {
  const K = `K[${i}]`, C = ch(e.canal), F = f(e.type === 'tete' ? Math.min((e.force ?? .006) * 3, .02) : (e.force ?? 1));
  const QS = f(1 / (e.echelle ?? 1));                 // echelle : agrandit le motif du bruit (grandes images)
  switch (e.type) {
    case 'respiration': fxD += `d -= (q - ${v2(e.centre)}) * vec2(0.6,1.0) * ${F} * br * ${C} * ${K};\n`; break;
    case 'balance':     fxD += `d += ${C} * vec2(${f(e.amp[0])},${f(e.amp[1])}) * (sin(t*W(${f(e.freq ?? 0.6)}) + ${f(e.phase ?? 0)}) + 0.35*sin(t*W(${f((e.freq ?? 0.6) * 2.1)}) + ${f((e.phase ?? 0) * 1.7 + 1)})) * ${K};
`; break;
    case 'geste':       fxU += `uniform float G${i};\n`;
                        fxD += `d += ${C} * G${i} * (${v2(e.amp || [0, 0])} + ${f(e.angle ?? 0)} * vec2(-(q.y - ${f((e.pivot || [0, 0])[1])}), q.x - ${f((e.pivot || [0, 0])[0])})) * ${K};\n`; break;
    case 'souleve':     fxD += `d.y -= ${F} * br * ${C} * ${K};\n`; break;
    case 'tete':        fxD += `{ float hw=(1.-smoothstep(${f(e.haut)},${f(e.bas)},q.y))*${C}; float ha=(${F}*(sin(t*W(0.37))+0.5*sin(t*W(0.91)+1.))+headInput)*${K}; d += hw*ha*vec2(-(q.y-${f(e.pivot[1])}), q.x-${f(e.pivot[0])}); d.y += hw*headLift*${K}; }\n`; break;
    // balancier : mouvement d'ensemble lent et coherent (tissu, cheveux) ; le poids C (0 a la racine, 1 au bout) retarde un peu
    // la phase vers le bout : une seule ondulation douce qui descend, jamais de vaguelettes. ondoie : champ qui respire sur place
    // (deux bruits tres larges fondus l'un dans l'autre, aucun motif qui defile) pour le feuillage et les grandes surfaces.
    case 'balancier': { const dv = e.dir || [1, 0], om = f(e.omega ?? 0.9), lag = f(e.retard ?? 1.0), ph = f(e.phase ?? 0);
                        fxD += `{ float c=${C}; float a=t*W(${om}) + ${ph} - c*${lag}; float a2=t*W(${om}*2.0) + ${ph}*1.7 + 1.1 - c*${lag}*1.5;
  d += c * ${F} * ${K} * ( vec2(${f(dv[0])},${f(dv[1])})*(sin(a) + 0.22*sin(a2)) + vec2(${f(-dv[1])},${f(dv[0])})*0.28*sin(a + 1.7) + ond2(q*${QS}*0.0016 + 7., ${om}*0.5)*0.30 ); }\n`; break; }
    case 'ondoie':      fxD += `d += ${C} * ond2(q*${QS}*${f(e.motif ?? 0.004)} + 3., ${f(e.omega ?? 0.6)}) * ${F} * ${K};\n`; break;
    case 'tissu':       fxD += `d += ${C} * (vn2(q*${QS}*0.0075 + cy(-wdir*35.*0.0075) + 3.)*${F} + vn2(q*${QS}*0.026 + cy(-wdir*60.*0.026) + 8.)*${F}*0.31 + wdir*(gust-0.4)*${F}*0.7) * ${K};\n`; break;
    case 'feuillage':   fxD += `d += ${C} * (wdir*(gust-0.4)*${F} + vn2(q*${QS}*0.011 + cy(-wdir*55.*0.011) + 5.)*${F}*0.6) * ${K};\n`; break;
    case 'frisson':     fxD += `d += ${C} * (vn2(q*${QS}*0.034 + cy(vec2(0.35,-0.25)) + 21.)*${F} + vn2(q*${QS}*0.085 + cy(vec2(-0.5,0.4)) + 33.)*${F}*0.5 + wdir*(gust-0.4)*${F}*0.25) * ${K};\n`; break;
    case 'flotte':      fxD += `d += ${C} * (vn2(q*${QS}*0.010 + cy(vec2(0.10,-0.07)) + 5.)*${F} + vn2(q*${QS}*0.028 + cy(-wdir*40.*0.028) + 9.)*${F}*0.34 + wdir*(gust-0.4)*${F}*0.46) * ${K};\n`; break;
    case 'nage':        fxD += `d += ${C} * (vn2(q*${QS}*0.004 + cy(vec2(0.11,0.08)) + 60.)*${F} + vn2(q*${QS}*0.030 + cy(vec2(1.3,-0.9)) + 3.)*${F}*0.2) * ${K};\n`; break;
    case 'eau':         fxD += `d += ${C} * (vn2(q*${QS}*0.0055 + cy(vec2(0.08,0.055)) + 40.) + vn2(q*${QS}*0.018 + cy(vec2(-0.17,0.11)) + 70.)*0.45 + vn2(q*${QS}*0.045 + cy(vec2(0.30,-0.20)) + 90.)*0.2) * ${F} * ${K};\n`; break;
    case 'derive':      fxD += `d += ${C} * vn2(q*${QS}*0.0042 + cy(vec2(0.055,-0.04)) + 17.) * ${F} * ${K};\n`; break;
    case 'ondes':
      fxU += `uniform vec2 P${i};\n`;
      fxD += `{ vec2 fp=q-P${i}; float fr=length(fp); float wv=sin(fr*0.115 - t*W(2.0))*exp(-fr/${f(e.rayon ?? 70)})*smoothstep(4.,22.,fr)*(0.65+0.35*sin(t*W(0.7))); d += (fp/max(fr,1.))*wv*${F}*${C}*${K}; ond += wv*${C}*${K}; }\n`;
      fxC += `col *= 1. + ond*0.05;\n`; break;
    case 'reflets':     fxC += `col *= 1. + ${C} * ${F} * (((vn(q*${QS}*0.0065 + cy(vec2(0.055,0.02)) + 9.)*2.-1.)*0.7 + (gust-0.5)*0.6) + 0.5*(vn(q*${QS}*0.012 + cy(vec2(0.20,-0.14)))*2.-1.)) * ${K};\n`; break;
    case 'lueur':
      (e.points || []).forEach((p, j) => { fxC += `col *= 1. + ${F} * g2(q, ${v2(p)}, vec2(${f(p[2] || 50)})) * sin(t*W(${f(0.7 + 0.13 * j)}) + ${f(j * 1.3)}) * ${K};\n`; }); break;
    default: console.warn('effet inconnu', e.type);
  }
});
const VS_BASE = `attribute vec2 a; varying vec2 v; void main(){ v=a*0.5+0.5; v.y=1.0-v.y; gl_Position=vec4(a,0.,1.); }`;
const FS_BASE = `
precision highp float;
varying vec2 v;
uniform sampler2D tex, dm${[...Array(NMASK).keys()].map(i => `, m${i}`).join('')};
uniform vec2 par, cov, drift;
uniform float zoom, t, headInput, headLift;
uniform float K[${Math.max(1, FX.length)}];
${fxU}
const vec2 IMG = vec2(${IMG_W}.,${IMG_H}.);
const float LOOP = ${LOOP.toFixed(1)};
float W(float w){ return 6.2831853*max(1.,floor(w*LOOP/6.2831853+0.5))/LOOP; }
vec2 cy(vec2 v){ float th=6.2831853*t/LOOP; float R=length(v)*LOOP/6.2831853; return R*vec2(cos(th)-1.,sin(th)); }
float g2(vec2 p, vec2 c, vec2 r){ vec2 q=(p-c)/r; return exp(-dot(q,q)); }
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
vec2 vn2(vec2 p){ return vec2(vn(p), vn(p+vec2(31.7,11.3)))*2.-1.; }
vec2 ond2(vec2 p, float w){ float a=t*W(w); return vn2(p+vec2(3.1,1.7))*cos(a) + vn2(p+vec2(17.7,9.2))*sin(a); }
void main(){
  vec2 uv = 0.5 + (v-0.5)/cov;
  vec2 c0 = IMG*0.5;
  vec2 q0 = c0 + (uv*IMG - c0)/zoom + drift;
  float D0 = texture2D(dm, q0/IMG).r;
  vec2 q = q0 - par * (D0 - ${DC.toFixed(3)});
  ${[...Array(NMASK).keys()].map(i => `vec3 M${i} = texture2D(m${i}, q/IMG).rgb;`).join(' ')}
  vec2 d = vec2(0.); float ond = 0.;
  vec2 wdir = vec2(${f(WDIR[0])},${f(WDIR[1])});
  float gust = (sin(t*W(1.3) + q.x*0.0030 + q.y*0.0028)*0.6 + sin(t*W(2.3) + q.y*0.008 - q.x*0.004)*0.4)*0.5+0.5;
  float br = sin(t*W(${(TAU / (ANIM.periode_respiration || 6)).toFixed(4)}));
${fxD}
  vec3 col = texture2D(tex, (q - d)/IMG).rgb;
${fxC}
  gl_FragColor = vec4(col, 1.);
}`;

/* =====================================================================================
   Passe 2 : calques (maillages recalcules en JS a chaque image)
   ===================================================================================== */
const VS_LAYER = `
attribute vec2 pos; attribute vec2 uv; varying vec2 vuv;
uniform vec2 cov, drift; uniform float zoom;
const vec2 IMG = vec2(${IMG_W}.,${IMG_H}.);
void main(){
  vec2 c0 = IMG*0.5;
  vec2 pc = c0 + (pos - drift - c0)*zoom;
  vec2 vv = 0.5 + (pc/IMG - 0.5)*cov;
  gl_Position = vec4(vv.x*2.-1., 1.-vv.y*2., 0., 1.);
  vuv = uv;
}`;
const FS_LAYER = `precision highp float; varying vec2 vuv; uniform sampler2D tex; uniform vec4 spr;
void main(){
  if(spr.x > 1.5){
    vec4 a = texture2D(tex, vec2((spr.y + vuv.x)/spr.x, vuv.y));
    vec4 b = texture2D(tex, vec2((spr.z + vuv.x)/spr.x, vuv.y));
    gl_FragColor = mix(a, b, spr.w);
  } else gl_FragColor = texture2D(tex, vuv);
}`;

function mk(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src); return s; }
function prog(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; }
const PB = prog(VS_BASE, FS_BASE), PL = prog(VS_LAYER, FS_LAYER);
/* ---------- particules (etincelles) : ANIM.particules = [{zone:[x0,y0,x1,y1], nombre, taille, monte, derive, couleur:[r,g,b], intensite, curseur}]
   entierement periodiques (chaque particule fait 1 a 3 cycles par boucle) ---------- */
const VS_PART = `attribute vec4 p; varying float va; uniform vec2 cov, drift; uniform float zoom, ps;
const vec2 IMG = vec2(${IMG_W}.,${IMG_H}.);
void main(){ vec2 c0 = IMG*0.5; vec2 pc = c0 + (p.xy - drift - c0)*zoom; vec2 vv = 0.5 + (pc/IMG - 0.5)*cov;
  gl_Position = vec4(vv.x*2.-1., 1.-vv.y*2., 0., 1.); gl_PointSize = max(1., p.z*ps*zoom); va = p.w; }`;
const FS_PART = `precision highp float; varying float va; uniform vec3 col;
void main(){ vec2 d = gl_PointCoord*2.-1.; float r = dot(d,d); if(r>1.) discard; float g = exp(-r*4.5); gl_FragColor = vec4(col*g*va, g*va); }`;
const PP = prog(VS_PART, FS_PART), partBuf = gl.createBuffer();
const PART = [];
(ANIM.particules || []).forEach((g, gi) => { for (let i = 0; i < g.nombre; i++) { const k = gi * 1000 + i * 7.31;
  PART.push({ g, x: g.zone[0] + rnd(k) * (g.zone[2] - g.zone[0]), y: g.zone[1] + rnd(k + 1) * (g.zone[3] - g.zone[1]), ph: rnd(k + 2), cyc: 1 + Math.floor(rnd(k + 3) * 3),
    sz: (0.45 + rnd(k + 4)) * g.taille, tw: 2 + Math.floor(rnd(k + 5) * 5), tp: rnd(k + 6) * TAU, wob: 6 + rnd(k + 7) * 22, wc: 1 + Math.floor(rnd(k + 8) * 2), ss: 0.6 + 0.8 * rnd(k + 9) }); } });
function drawParticles(cam, t) {
  if (!PART.length) return;
  gl.useProgram(PP); gl.blendFunc(gl.ONE, gl.ONE);
  const groups = ANIM.particules;
  groups.forEach((g, gi) => {
    const K = val(g.curseur) * (g.intensite ?? 1); if (K < 0.01) return;
    const arr = [];
    for (const q of PART) { if (q.g !== g) continue;
      const u = ((t / LOOP) * q.cyc + q.ph) % 1, a = Math.pow(Math.sin(Math.PI * u), 1.6) * (0.55 + 0.45 * Math.sin(TAU * t / LOOP * q.tw + q.tp));
      const x = q.x + (g.derive ?? 0) * u * q.ss + Math.sin(TAU * (t / LOOP * q.wc + q.ph)) * q.wob, y = q.y - (g.monte ?? 100) * u * q.ss;
      arr.push(x, y, q.sz * (0.7 + 0.3 * a), a * K); }
    gl.bindBuffer(gl.ARRAY_BUFFER, partBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.DYNAMIC_DRAW);
    const lp = gl.getAttribLocation(PP, 'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 4, gl.FLOAT, false, 0, 0);
    const c = g.couleur || [1, 0.85, 0.5]; gl.uniform3f(gl.getUniformLocation(PP, 'col'), c[0], c[1], c[2]);
    gl.uniform2f(gl.getUniformLocation(PP, 'cov'), cam.cov[0], cam.cov[1]); gl.uniform2f(gl.getUniformLocation(PP, 'drift'), cam.drift[0], cam.drift[1]);
    gl.uniform1f(gl.getUniformLocation(PP, 'zoom'), cam.zoom); gl.uniform1f(gl.getUniformLocation(PP, 'ps'), canvas.height / IMG_H * 2.2 * (cam.cov[1] > 1 ? cam.cov[1] : 1));
    gl.drawArrays(gl.POINTS, 0, arr.length / 4);
  });
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
}
/* ---------- etincelles : ANIM.etincelles = [{points:[[x,y,taille],...], couleur, intensite, curseur, eclats}]
   chaque point s'allume brievement (eclat en etoile a 4 branches) 'eclats' fois par boucle, a des instants differents ---------- */
const FS_ETOILE = `precision highp float; varying float va; uniform vec3 col;
void main(){ vec2 d = gl_PointCoord*2.-1.; float r = length(d);
  float coeur = exp(-r*r*16.), branches = (exp(-abs(d.x)*16.)*exp(-d.y*d.y*2.4) + exp(-abs(d.y)*16.)*exp(-d.x*d.x*2.4))*max(0., 1.-r*0.7);
  float g = clamp(coeur + 0.7*branches, 0., 1.); gl_FragColor = vec4(col*g*va, g*va); }`;
const PE = prog(VS_PART, FS_ETOILE), etBuf = gl.createBuffer();
function drawEtincelles(cam, t) {
  const G = ANIM.etincelles || []; if (!G.length) return;
  gl.useProgram(PE); gl.blendFunc(gl.ONE, gl.ONE);
  G.forEach((g, gi) => {
    const K = val(g.curseur) * (g.intensite ?? 0.8); if (K < 0.01) return;
    const arr = [];
    g.points.forEach((q, i) => {
      const k = gi * 977 + i * 13.7, n = g.eclats ?? 3, ph = rnd(k), u = ((t / LOOP) * n + ph) % 1;
      const a = Math.pow(Math.max(0, Math.sin(Math.PI * Math.min(1, u / 0.1))), 1.5) * (u < 0.1 ? 1 : 0);   // eclat bref (10 % du cycle)
      if (q.D === undefined) q.D = DEPTH ? sampleImg(DEPTH, q[0] / IMG_W, q[1] / IMG_H) : DC;      // suit la parallaxe de l'image
      if (a > 0.003) arr.push(q[0] + par[0] * (q.D - DC), q[1] + par[1] * (q.D - DC), q[2] * (0.6 + 0.4 * a), a * K * (0.6 + 0.4 * rnd(k + 3)));
    });
    if (!arr.length) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, etBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.DYNAMIC_DRAW);
    const lp = gl.getAttribLocation(PE, 'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 4, gl.FLOAT, false, 0, 0);
    const c = g.couleur || [1, 0.95, 0.85]; gl.uniform3f(gl.getUniformLocation(PE, 'col'), c[0], c[1], c[2]);
    gl.uniform2f(gl.getUniformLocation(PE, 'cov'), cam.cov[0], cam.cov[1]); gl.uniform2f(gl.getUniformLocation(PE, 'drift'), cam.drift[0], cam.drift[1]);
    gl.uniform1f(gl.getUniformLocation(PE, 'zoom'), cam.zoom); gl.uniform1f(gl.getUniformLocation(PE, 'ps'), canvas.height / IMG_H * (cam.cov[1] > 1 ? cam.cov[1] : 1));
    gl.drawArrays(gl.POINTS, 0, arr.length / 4);
  });
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
}
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

function makeMesh(box, cell) {
  const [bx, by, bw, bh] = box, nx = Math.ceil(bw / cell) + 1, ny = Math.ceil(bh / cell) + 1;
  const n = nx * ny, rest = new Float32Array(n * 2), uv = new Float32Array(n * 2), pos = new Float32Array(n * 2);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const id = j * nx + i, x = Math.min(bx + i * cell, bx + bw), y = Math.min(by + j * cell, by + bh);
    rest[id * 2] = x; rest[id * 2 + 1] = y; uv[id * 2] = (x - bx) / bw; uv[id * 2 + 1] = (y - by) / bh;
  }
  pos.set(rest);

  gl.disable(gl.BLEND); gl.useProgram(PB);
  const la = gl.getAttribLocation(PB, 'a'); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(PB, n);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.base); gl.uniform1i(U('tex'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T.depth); gl.uniform1i(U('dm'), 1);
  T.masks.forEach((m, i) => { gl.activeTexture(gl.TEXTURE2 + i); gl.bindTexture(gl.TEXTURE_2D, m); gl.uniform1i(U('m' + i), 2 + i); });
  gl.uniform2f(U('par'), par[0], par[1]); gl.uniform2f(U('cov'), cam.cov[0], cam.cov[1]); gl.uniform2f(U('drift'), cam.drift[0], cam.drift[1]);
  gl.uniform1f(U('zoom'), cam.zoom); gl.uniform1f(U('t'), time);
  gl.uniform1f(U('headInput'), renderedHead);
  gl.uniform1f(U('headLift'), renderedLift);
  gl.uniform1fv(U('K'), new Float32Array(Math.max(1, FX.length)).map((_, i) => FX[i] ? val(FX[i].curseur) * (FX[i].actif === false ? 0 : 1) : 0));
  FX.forEach((e, i) => { if (e.type === 'geste') gl.uniform1f(U('G' + i), geste(e.courbe, time - (e.retard ?? 0)));
    if (e.type === 'ondes') { let p = e.point; const L = e.suit && LAYERS.find(l => l.nom === e.suit); if (L && L.boutNow) p = L.boutNow; gl.uniform2f(U('P' + i), p[0], p[1]); } });
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  for (const L of LAYERS) {
    if (L.type === 'visage' && L.mode === 'expression') {        // visage vivant : la bande va de s = -1 a +1, l'original au milieu
      const automatic = geste(L.courbe, time), mix = S.kane_regard ? interaction.blend : 0;
      const gaze = automatic * (1 - mix) + Math.max(-1, Math.min(1, interaction.x * 1.5)) * strength() * mix;
      const s = Math.max(-1, Math.min(1, gaze * val(L.curseur)));
      const x = (s + 1) / 2 * (L.images - 1), fa = Math.floor(x), fb = Math.min(L.images - 1, fa + 1);
      drawMesh(L.mesh, L.tex, cam, [L.images, fa, fb, x - fa]);
    } else if (L.type === 'visage') {
      const b = blinkAmount(L, time) * val(L.curseur); if (b < 0.002) continue;
      const x = b * (L.images - 1), fa = Math.floor(x), fb = Math.min(L.images - 1, fa + 1);
      drawMesh(L.mesh, L.tex, cam, [L.images, fa, fb, x - fa]);
    } else drawMesh(L.mesh, L.tex, cam);
  }
  drawParticles(cam, time); drawEtincelles(cam, time);
}
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  time += dt * S.vitesse; updateParallax(time, dt); render(); requestAnimationFrame(frame);
}
init();

// Wallpaper Engine : proprietes reglables (cles = ANIM.curseurs + vitesse, profondeur)
window.wallpaperPropertyListener = { applyUserProperties(p) { for (const k in p) if (k in S) S[k] = p[k].value; } };
</script>
